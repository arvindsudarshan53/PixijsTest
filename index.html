<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dataset Maggots - PIXI</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
    }
    #ui {
      position: absolute;
      top: 10px;
      right: 10px;
      padding: 10px;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 8px;
    }
    #maggotSlider {
      width: 200px;
    }
  </style>
</head>
<body>
    <div id="ui">
        <label>
          Maggot Count: <span id="maggotCount">5000</span>
        </label><br />
        <input type="range" id="maggotSlider" min="0" max="5000" value="5000" step="100" /><br /><br />
      
        <label>
          Category:
          <select id="categoryDropdown">
            <option value="">-- Select Category --</option>
            <option value="1">Category 1</option>
            <option value="2">Category 2</option>
            <option value="3">Category 3</option>
            <option value="4">Category 4</option>
          </select>
        </label>
      </div>

  

  <script type="module" src="index.js"></script>
</body>
</html>
